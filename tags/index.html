<div id="tagsResults"></div>
<div id="seoHiddenContent" style="display: none;"></div>

<script>
// ==================== FUNGSI UTAMA ====================

// Fungsi untuk mengacak array
function shuffleArray(array) {
  const shuffled = [...array];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

// Fungsi untuk mendapatkan keyword dari query parameter
function getKeywordFromURL() {
  const urlParams = new URLSearchParams(window.location.search);
  const keywordParam = urlParams.get('q');
  const pageNum = parseInt(urlParams.get('page') || '1');
  
  return {
    keyword: keywordParam ? decodeURIComponent(keywordParam)
      .replace(/\+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .toLowerCase() : '',
    page: pageNum
  };
}

// Fungsi untuk membuat URL tag dengan query parameter
function createTagURL(keyword, page = 1) {
  const cleanKeyword = keyword.trim();
  const encodedKeyword = encodeURIComponent(cleanKeyword.replace(/\s+/g, '+'));
  
  if (page > 1) {
    return `/tags/?q=${encodedKeyword}&page=${page}`;
  }
  return `/tags/?q=${encodedKeyword}`;
}

// Fungsi untuk membuat URL category/label/tag
function createTaxonomyURL(type, term) {
  const cleanTerm = term.trim().toLowerCase();
  const encodedTerm = encodeURIComponent(cleanTerm.replace(/\s+/g, '+'));
  return `/${type}/?q=${encodedTerm}`;
}

// Fungsi untuk mencari post yang mengandung keyword tertentu
function searchPostsByKeyword(posts, keyword) {
  const lowerKeyword = keyword.toLowerCase().trim();
  
  return posts.filter(post => {
    const content = post.content || '';
    return content.toLowerCase().includes(lowerKeyword);
  });
}

// Format judul dengan keyword di awal
function formatTitleWithKeyword(originalTitle, keyword) {
  if (!keyword) return originalTitle;
  return keyword + ' - ' + originalTitle;
}

// Generate related keywords untuk SEO
function generateRelatedKeywords(keyword) {
  const suffixes = ['content', 'posts', 'articles', 'photos', 'videos', 'tutorial', 'guide', 'tips', 'review'];
  return suffixes.map(suffix => keyword + ' ' + suffix);
}

// Fungsi utama untuk tags
async function runTags() {
  const { keyword, page } = getKeywordFromURL();
  const container = document.getElementById("tagsResults");
  const breadcrumb = document.getElementById("tagsBreadcrumb");
  const seoHidden = document.getElementById("seoHiddenContent");

  // Update breadcrumb
  if (keyword) {
    breadcrumb.innerHTML = `
      <a href="/">Home</a>
      <span class="breadcrumb-separator">›</span>
      <span style="color: #e74c3c; font-weight: bold;">${escapeHtml(keyword)}</span>
    `;
    container.innerHTML = '';
  } else {
    breadcrumb.innerHTML = `
      <a href="/">Home</a>
      <span class="breadcrumb-separator">›</span>
      <span>Tags</span>
    `;
    
    container.innerHTML = `
      <div class="tags-empty">
        <h1>Search Posts by Keyword</h1>
        <p>Enter a keyword in the URL like: <code>/tags/?q=keyword</code></p>
      </div>
    `;
    return;
  }

  try {
    // FETCH SATU SUMBER DATA: search.json
    const response = await fetch("https://rfazriansyah376plus1.github.io/search.json");
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const allPosts = await response.json();

    // Cari post yang mengandung keyword
    const allResults = searchPostsByKeyword(allPosts, keyword);
    
    // Pagination
    const postsPerPage = 10;
    const totalResults = allResults.length;
    const totalPages = Math.ceil(totalResults / postsPerPage);
    const startIndex = (page - 1) * postsPerPage;
    const endIndex = startIndex + postsPerPage;
    const currentResults = allResults.slice(startIndex, endIndex);

    // Structured Data
    const breadcrumbData = {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "name": "Home",
          "item": window.location.origin + "/"
        },
        {
          "@type": "ListItem",
          "position": 2,
          "name": keyword,
          "item": window.location.href
        }
      ]
    };
    
    const breadcrumbScript = document.createElement('script');
    breadcrumbScript.type = 'application/ld+json';
    breadcrumbScript.textContent = JSON.stringify(breadcrumbData);
    document.head.appendChild(breadcrumbScript);

    // Hidden SEO content
    if (seoHidden && keyword) {
      const relatedKeywords = generateRelatedKeywords(keyword);
      seoHidden.innerHTML = `
        <h2>Posts about ${escapeHtml(keyword)}</h2>
        <p>Find the best ${escapeHtml(keyword)} content, ${escapeHtml(keyword)} articles, and ${escapeHtml(keyword)} resources.</p>
        <p>Browse ${escapeHtml(keyword)} posts, ${escapeHtml(keyword)} photos, and ${escapeHtml(keyword)} videos.</p>
        <ul>
          ${relatedKeywords.map(kw => `<li>${escapeHtml(kw)}</li>`).join('')}
        </ul>
        <p>Updated regularly with new ${escapeHtml(keyword)} content.</p>
      `;
    }

    // Tampilkan hasil
    if (currentResults.length > 0) {
      displayTagResults(currentResults, keyword, container, page, totalPages, totalResults);
    } else {
      // Jika tidak ada hasil, tampilkan random posts dari search.json
      await loadRandomPosts(allPosts, container, 9, keyword);
    }

  } catch (error) {
    console.error("Tags error:", error);
    // Coba fetch ulang untuk random posts
    try {
      const fallbackResponse = await fetch("https://rfazriansyah376plus1.github.io/search.json");
      const fallbackPosts = await fallbackResponse.json();
      await loadRandomPosts(fallbackPosts, container, 9, keyword);
    } catch {
      container.innerHTML = `
        <div class="error-message">
          <p>Maaf, terjadi kesalahan. Silakan coba lagi nanti.</p>
          <a href="/" class="browse-all">Kembali ke Home</a>
        </div>
      `;
    }
  }
}

// Fungsi: Tampilkan hasil pencarian
function displayTagResults(results, keyword, container, currentPage, totalPages, totalResults) {
  const lowerKeyword = keyword.toLowerCase();
  const escapedKeyword = lowerKeyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const keywordRegex = new RegExp(`(${escapedKeyword})`, 'gi');
  
  const html = results.map(post => {
    const originalTitle = post.title || 'Untitled Post';
    const formattedTitle = formatTitleWithKeyword(originalTitle, keyword);
    const postDate = post.date || '';
    
    // Link postingan
    let postPath = '';
    if (post.url) {
      try {
        const urlObj = new URL(post.url);
        postPath = urlObj.pathname + urlObj.search + urlObj.hash;
      } catch {
        postPath = post.url.startsWith('/') ? post.url : '/' + post.url;
      }
    } else {
      postPath = '/';
    }
    
    if (!postPath.startsWith('/')) {
      postPath = '/' + postPath;
    }
    
    const postURL = 'https://rfazriansyah376plus1.github.io' + postPath;
    
    // === AMBIL CATEGORIES, LABELS, TAGS (ARRAY DARI JSON) ===
    let postCategories = [];
    let postLabels = [];
    let postTags = [];
    
    // Categories (array dari JSON)
    if (post.categories && Array.isArray(post.categories)) {
      postCategories = post.categories.filter(cat => cat && typeof cat === 'string' && cat.trim() !== '');
    }
    
    // Labels (array dari JSON)
    if (post.labels && Array.isArray(post.labels)) {
      postLabels = post.labels.filter(label => label && typeof label === 'string' && label.trim() !== '');
    }
    
    // Tags (array dari JSON)
    if (post.tags && Array.isArray(post.tags)) {
      postTags = post.tags.filter(tag => tag && typeof tag === 'string' && tag.trim() !== '');
    }
    
    // Hapus duplikat masing-masing
    postCategories = [...new Set(postCategories)];
    postLabels = [...new Set(postLabels)];
    postTags = [...new Set(postTags)];
    
    // Buat snippet dari content
    let snippet = '';
    const content = post.content || '';
    const keywordIndex = content.toLowerCase().indexOf(lowerKeyword);
    
    if (keywordIndex !== -1) {
      const start = Math.max(0, keywordIndex - 150);
      const end = Math.min(content.length, keywordIndex + lowerKeyword.length + 150);
      snippet = content.substring(start, end);
      snippet = (start > 0 ? '...' : '') + snippet + (end < content.length ? '...' : '');
      snippet = snippet.replace(keywordRegex, '<mark class="highlight">$1</mark>');
    } else {
      snippet = content.substring(0, 200) + '...';
    }
    
    // Gambar (fallback)
    const altText = escapeHtml(keyword);
    const imageUrl = 'https://rfazriansyah376plus1.github.io/photo/fallback.png';
    
    // Format tanggal
    const dateHTML = postDate ? `<div class="post-date">${escapeHtml(postDate)}</div>` : '';
    
    // === URUTAN: Judul, Gambar, Excerpt, Categories, Labels, Tags ===
    return `
      <article class="post-item tags-result">
        ${dateHTML}
        
        <!-- 1. JUDUL -->
        <h3 class="post-title">
          <a href="${postURL}" target="_blank" rel="noopener">${escapeHtml(formattedTitle)}</a>
        </h3>
        
        <!-- 2. GAMBAR -->
        <div class="post-thumbnail">
          <a href="${postURL}" target="_blank" rel="noopener">
            <img src="${imageUrl}" 
                 alt="${altText}"
                 title="${escapeHtml(keyword)} content"
                 loading="lazy" 
                 class="post-image">
          </a>
        </div>
        
        <!-- 3. EXCERPT -->
        <div class="post-excerpt">
          <p class="snippet">${snippet}</p>
        </div>
        
        <!-- 4. CATEGORIES -->
        ${postCategories.length > 0 ? `
          <div class="post-taxonomy categories">
            <span class="taxonomy-label">Kategori:</span>
            ${postCategories.map(cat => {
              const catURL = createTaxonomyURL('categories', cat);
              return `<a href="${catURL}" class="taxonomy-link category-link" rel="category tag">${escapeHtml(cat)}</a>`;
            }).join('')}
          </div>
        ` : ''}
        
        <!-- 5. LABELS (jika ada) -->
        ${postLabels.length > 0 ? `
          <div class="post-taxonomy labels">
            <span class="taxonomy-label">Label:</span>
            ${postLabels.map(label => {
              const labelURL = createTaxonomyURL('labels', label);
              return `<a href="${labelURL}" class="taxonomy-link label-link" rel="tag">${escapeHtml(label)}</a>`;
            }).join('')}
          </div>
        ` : ''}
        
        <!-- 6. TAGS (jika ada) -->
        ${postTags.length > 0 ? `
          <div class="post-taxonomy tags">
            <span class="taxonomy-label">Tag:</span>
            ${postTags.map(tag => {
              const tagURL = createTaxonomyURL('tags', tag);
              return `<a href="${tagURL}" class="taxonomy-link tag-link" rel="tag">${escapeHtml(tag)}</a>`;
            }).join('')}
          </div>
        ` : ''}
        
        <!-- READ MORE -->
        <div class="post-read-more">
          <a href="${postURL}" target="_blank" rel="noopener" class="read-more-link">Baca selengkapnya →</a>
        </div>
      </article>
    `;
  }).join('');

  // Pagination
  let paginationHTML = '';
  if (totalPages > 1) {
    paginationHTML = `
      <div class="pagination">
        ${currentPage > 1 ? 
          `<a href="${createTagURL(keyword, currentPage - 1)}" class="page-link" rel="prev">← Previous</a>` : 
          `<span class="page-link disabled">← Previous</span>`}
        
        <span class="page-link active">Page ${currentPage} of ${totalPages}</span>
        
        ${currentPage < totalPages ? 
          `<a href="${createTagURL(keyword, currentPage + 1)}" class="page-link" rel="next">Next →</a>` : 
          `<span class="page-link disabled">Next →</span>`}
      </div>
    `;
  }

  container.innerHTML = html + paginationHTML;
}

// Fungsi: Load random posts dari data yang sama (search.json)
async function loadRandomPosts(allPosts, container, count = 9, keyword = '') {
  try {
    if (!Array.isArray(allPosts) || allPosts.length === 0) {
      throw new Error("No posts available");
    }
    
    // Acak postingan
    const shuffledPosts = shuffleArray([...allPosts]);
    const randomPosts = shuffledPosts.slice(0, Math.min(count, allPosts.length));
    
    const randomPostsHTML = randomPosts.map(post => {
      // Link postingan
      let postPath = '';
      if (post.url) {
        try {
          const urlObj = new URL(post.url);
          postPath = urlObj.pathname + urlObj.search + urlObj.hash;
        } catch {
          postPath = post.url.startsWith('/') ? post.url : '/' + post.url;
        }
      } else {
        postPath = '/';
      }
      
      if (!postPath.startsWith('/')) {
        postPath = '/' + postPath;
      }
      
      const postURL = 'https://rfazriansyah376plus1.github.io' + postPath;
      
      const originalTitle = post.title || 'Untitled Post';
      const formattedTitle = keyword ? formatTitleWithKeyword(originalTitle, keyword) : originalTitle;
      const excerpt = post.excerpt || post.content?.substring(0, 150) || '';
      const postDate = post.date || '';
      
      // === AMBIL CATEGORIES, LABELS, TAGS (ARRAY DARI JSON) ===
      let postCategories = [];
      let postLabels = [];
      let postTags = [];
      
      // Categories (array dari JSON)
      if (post.categories && Array.isArray(post.categories)) {
        postCategories = post.categories.filter(cat => cat && typeof cat === 'string' && cat.trim() !== '');
      }
      
      // Labels (array dari JSON)
      if (post.labels && Array.isArray(post.labels)) {
        postLabels = post.labels.filter(label => label && typeof label === 'string' && label.trim() !== '');
      }
      
      // Tags (array dari JSON)
      if (post.tags && Array.isArray(post.tags)) {
        postTags = post.tags.filter(tag => tag && typeof tag === 'string' && tag.trim() !== '');
      }
      
      // Hapus duplikat
      postCategories = [...new Set(postCategories)];
      postLabels = [...new Set(postLabels)];
      postTags = [...new Set(postTags)];
      
      // Gambar (fallback)
      const altText = keyword ? escapeHtml(keyword) : "random posts";
      const imageUrl = 'https://rfazriansyah376plus1.github.io/photo/fallback.png';
      
      // Format tanggal
      const dateHTML = postDate ? `<div class="post-date">${escapeHtml(postDate)}</div>` : '';
      
      // === URUTAN: Judul, Gambar, Excerpt, Categories, Labels, Tags ===
      return `
        <article class="post-item random-post">
          ${dateHTML}
          
          <!-- 1. JUDUL -->
          <h4 class="post-title">
            <a href="${postURL}" target="_blank" rel="noopener">${escapeHtml(formattedTitle)}</a>
          </h4>
          
          <!-- 2. GAMBAR -->
          <div class="post-thumbnail">
            <a href="${postURL}" target="_blank" rel="noopener">
              <img src="${imageUrl}" 
                   alt="${altText}"
                   title="${keyword ? escapeHtml(keyword) + ' content' : 'random posts'}"
                   loading="lazy" 
                   class="post-image">
            </a>
          </div>
          
          <!-- 3. EXCERPT -->
          ${excerpt ? `<div class="post-excerpt"><p class="excerpt">${escapeHtml(excerpt)}...</p></div>` : ''}
          
          <!-- 4. CATEGORIES -->
          ${postCategories.length > 0 ? `
            <div class="post-taxonomy categories">
              <span class="taxonomy-label">Kategori:</span>
              ${postCategories.map(cat => {
                const catURL = createTaxonomyURL('categories', cat);
                return `<a href="${catURL}" class="taxonomy-link category-link" rel="category tag">${escapeHtml(cat)}</a>`;
              }).join('')}
            </div>
          ` : ''}
          
          <!-- 5. LABELS (jika ada) -->
          ${postLabels.length > 0 ? `
            <div class="post-taxonomy labels">
              <span class="taxonomy-label">Label:</span>
              ${postLabels.map(label => {
                const labelURL = createTaxonomyURL('labels', label);
                return `<a href="${labelURL}" class="taxonomy-link label-link" rel="tag">${escapeHtml(label)}</a>`;
              }).join('')}
            </div>
          ` : ''}
          
          <!-- 6. TAGS (jika ada) -->
          ${postTags.length > 0 ? `
            <div class="post-taxonomy tags">
              <span class="taxonomy-label">Tag:</span>
              ${postTags.map(tag => {
                const tagURL = createTaxonomyURL('tags', tag);
                return `<a href="${tagURL}" class="taxonomy-link tag-link" rel="tag">${escapeHtml(tag)}</a>`;
              }).join('')}
            </div>
          ` : ''}
          
          <!-- READ MORE -->
          <div class="post-read-more">
            <a href="${postURL}" target="_blank" rel="noopener" class="read-more-link">Baca selengkapnya →</a>
          </div>
        </article>
      `;
    }).join('');
    
    container.innerHTML = `
      <div class="random-posts-grid">
        ${randomPostsHTML}
      </div>
      <div class="fallback-footer">
        <a href="/" class="browse-all">Go to Homepage →</a>
      </div>
    `;
    
  } catch (error) {
    console.error("Failed to load random posts:", error);
    container.innerHTML = `
      <div class="error-message">
        <p>Maaf, tidak dapat memuat postingan.</p>
        <a href="/" class="browse-all">Kembali ke Home</a>
      </div>
    `;
  }
}

// Helper: Escape HTML
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ==================== INISIALISASI ====================

document.addEventListener('DOMContentLoaded', function() {
  runTags();
});

// Redirect old tag URLs
(function redirectOldTagURLs() {
  const currentPath = window.location.pathname;
  const urlParams = new URLSearchParams(window.location.search);
  
  if (currentPath.startsWith('/tags/') && !currentPath.endsWith('/tags/')) {
    const parts = currentPath.split('/').filter(p => p);
    if (parts[0] === 'tags' && parts[1] && !urlParams.has('q')) {
      const keyword = decodeURIComponent(parts[1])
        .replace(/-/g, ' ')
        .trim()
        .toLowerCase();
      
      const newURL = createTagURL(keyword);
      if (window.location.href !== newURL) {
        window.history.replaceState(null, '', newURL);
        location.reload();
      }
    }
  }
})();
</script>
